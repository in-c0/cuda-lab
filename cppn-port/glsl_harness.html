const vs=`#version 300 es

const fs="#version 300 es\n  precision highp float;\n  out vec4 outColor;\n\n  uniform vec2  u_res;\n  uniform float u_time;\n  uniform float u_vitality;\n  uniform float u_restless;\n  uniform float u_dream;        // 0 awake .. 1 dreaming (smoothed)\n  uniform float u_beat;         // heartbeat 0..1\n  uniform vec2  u_pointer;      // p-space (centred, y up)\n  uniform float u_pointerGlow;  // 0..1\n  uniform int   u_alive;\n  uniform vec4  u_G[96]; // packed organisms: meta + genome\n\n  float hash(vec2 p){ p = fract(p*vec2(123.34, 345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }\n  float noise(vec2 p){\n    vec2 i = floor(p), f = fract(p);\n    float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));\n    vec2 u = f*f*(3.0-2.0*f);\n    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);\n  }\n  float fbm(vec2 p){\n    float v = 0.0, a = 0.5;\n    for (int i = 0; i < 5; i++){ v += a*noise(p); p = p*2.03 + 7.1; a *= 0.5; }\n    return v;\n  }\n\n  float actF(float a, float x){\n    if (a < 0.5) return sin(x);\n    if (a < 1.5) return exp(-x*x)*2.0 - 1.0;\n    if (a < 2.5) return tanh(x);\n    return abs(fract(x*0.25+0.25)-0.5)*4.0 - 1.0;\n  }\n\n  // Evaluate one organism's genome at a local point. B is the\n  // organism's base index into u_G (vec4 units).\n  float cppn(int B, vec2 lp, float lr, float ica, float isa, float tt){\n    float acc = u_G[B+15].z; // output bias\n    for (int i = 0; i < 6; i++){\n      vec4 n0 = u_G[B+2+2*i];\n      vec4 n1 = u_G[B+3+2*i];\n      float pre = n0.y + n0.z*tt + n0.w*lp.x + n1.x*lp.y + n1.y*lr + n1.z*ica + n1.w*isa;\n      float h = actF(n0.x, pre);\n      float ow = (i < 4) ? u_G[B+14][i] : u_G[B+15][i-4];\n      acc += ow*h;\n    }\n    return acc;\n  }\n\n  vec3 toneMap(vec3 x){\n    x = vec3(1.0) - exp(-x * 1.08);\n    return pow(x, vec3(0.4545));\n  }\n\n  void main(){\n    vec2 frag = gl_FragCoord.xy;\n    vec2 uv = frag / u_res;\n    vec2 p = (frag - 0.5*u_res) / u_res.y;\n    float r = length(p);\n    float ang = atan(p.y, p.x);\n\n    // ---- mood \u2192 luminous palette --------------------------------------\n    vec3 cWarm = vec3(1.00, 0.80, 0.45);\n    vec3 cViolet = vec3(0.62, 0.48, 1.00);\n    vec3 cBlue = vec3(0.30, 0.50, 1.00);\n    vec3 tint = normalize(cWarm*(0.25+0.75*u_vitality) + cViolet*0.45 + cBlue*(0.25+0.65*u_restless) + 0.02);\n    vec3 tintCool = mix(tint, cBlue, 0.5*u_dream);\n\n    vec3 col = vec3(0.0);\n\n    // ---- background nebula --------------------------------------------\n    float driftT = u_time*0.035;\n    float neb = fbm(p*1.6 + vec2(driftT, -driftT*0.7));\n    neb = pow(neb, 1.7);\n    float neb2 = fbm(p*3.4 - vec2(driftT*1.3, driftT));\n    vec3 bg = mix(vec3(0.005,0.007,0.017), tintCool*0.09, neb);\n    bg += tint*0.03*neb2*(0.3+0.5*u_restless);\n    col += bg;\n\n    // ---- the embryo body: a refractive glass orb ----------------------\n    float R = 0.225 + 0.014*u_beat*(0.5+u_vitality) + 0.007*sin(u_time*0.6);\n    float z = sqrt(max(R*R - r*r, 0.0)) / max(R, 1e-4);\n    float inside = smoothstep(R+0.004, R-0.004, r);\n    float fres = pow(1.0 - clamp(z,0.0,1.0), 2.5);\n\n    vec2 sp = p * (5.5 + 2.0*z);\n    vec2 warp = vec2(cos(ang*2.0+u_time*0.4), sin(ang*2.0-u_time*0.3)) * (0.35*z);\n    float ca = 0.010 + 0.018*fres + 0.006*u_restless;\n    float cauR = fbm(sp + warp + vec2(u_time*0.10, 0.0) + ca);\n    float cauG = fbm(sp + warp + vec2(u_time*0.10, 0.0));\n    float cauB = fbm(sp + warp + vec2(u_time*0.10, 0.0) - ca);\n    vec3 caustic = pow(vec3(cauR, cauG, cauB), vec3(2.0));\n    vec3 core = tint * (0.10 + 1.45*caustic) * inside * (0.30 + 0.9*z);\n    core += tint * inside * (0.05 + 0.15*u_vitality) * (0.4 + 0.7*z);\n    core += tint * u_beat * inside * exp(-r*8.0) * (0.25 + 0.40*u_vitality);\n    vec3 rimCol = mix(vec3(1.0,0.62,0.82), tint, 0.55)*fres*ca*24.0 + tint*fres*1.2;\n    core += rimCol * inside * 0.8;\n    col += core;\n\n    float halo = exp(-max(r-R,0.0)*8.5);\n    col += tint * halo * (0.10 + 0.13*u_vitality) * (0.7+0.3*u_beat);\n\n    // ---- the living signs: genomes rendered as refracted light --------\n    float disp = 0.020 + 0.020*u_restless; // chromatic dispersion\n    for (int gI = 0; gI < 6; gI++){\n      if (gI >= u_alive) break;\n      int B = gI*16;\n      vec4 m0 = u_G[B];     // pos.xy, radius, fade\n      vec4 m1 = u_G[B+1];   // tint.rgb, timeRate\n      vec2 lp = (p - m0.xy) / m0.z;\n      float lr = length(lp);\n      if (lr > 1.6) continue;\n      float ica = lr > 1e-4 ? lp.x/lr : 1.0;\n      float isa = lr > 1e-4 ? lp.y/lr : 0.0;\n      float tt = u_time * m1.w;\n      float fR = cppn(B, lp, lr+disp, ica, isa, tt);\n      float fB = cppn(B, lp, lr-disp, ica, isa, tt);\n      float fG = 0.5*(fR+fB);\n      float lw = u_G[B+15].w;\n      vec3 line = vec3(\n        1.0 - smoothstep(0.0, lw, abs(fR)),\n        1.0 - smoothstep(0.0, lw, abs(fG)),\n        1.0 - smoothstep(0.0, lw, abs(fB))\n      );\n      float env = exp(-lr*lr*0.9);\n      vec3 gc = mix(m1.rgb, vec3(0.55,0.60,1.0), 0.35*u_dream);\n      col += line * gc * env * m0.w * (1.55 + 0.85*u_dream);\n      col += gc * 0.16 * exp(-abs(fG)*2.0) * env * m0.w; // soft aura\n    }\n\n    // ---- attention: a caustic bloom that follows the cursor -----------\n    float pd = length(p - u_pointer);\n    float spark = u_pointerGlow * exp(-pd*pd*26.0);\n    col += (tint*0.6 + vec3(0.5,0.7,1.0)*0.5) * spark * 1.3;\n    col += tint * u_pointerGlow * 0.25 * (1.0 - smoothstep(0.0, 0.02, abs(pd-0.06-0.04*sin(u_time*3.0))));\n\n    // ---- finish -------------------------------------------------------\n    col *= 1.0 - 0.55*smoothstep(0.35, 1.35, length(p));\n    col = toneMap(col);\n    col += (hash(uv*u_res + u_time)-0.5)*0.015;\n    outColor = vec4(col, 1.0);\n  }";

const dbg=gl.getExtension('WEBGL_debug_renderer_info');
let info='RENDERER='+gl.getParameter(gl.RENDERER);

function report(s){ document.title=s; const d=document.createElement('pre'); d.id='info';
  d.textContent=s; d.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(d); }
const ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');
if(ext){
  const N=200, q=gl.createQuery();
  for(let i=0;i<20;i++) gl.drawArrays(gl.TRIANGLES,0,6);
  gl.finish();
  gl.beginQuery(ext.TIME_ELAPSED_EXT,q);
  for(let i=0;i<N;i++) gl.drawArrays(gl.TRIANGLES,0,6);
  gl.endQuery(ext.TIME_ELAPSED_EXT);
  gl.finish();
  const poll=()=>{
    if(gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE)){
      const ns=gl.getQueryParameter(q,gl.QUERY_RESULT);
      report(info+' | TIMER_ELAPSED_ms_per_draw='+(ns/1e6/N).toFixed(4)+' | N='+N);
    } else setTimeout(poll,50);

} else report(info+' | TIMER=unavailable');
